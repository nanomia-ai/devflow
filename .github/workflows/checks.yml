name: checks

on: [push, pull_request]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The document system's wall. jgnote gets this from quality.yml on every merge; without it
      # devflow's checks only run when a session remembers to, and "documents follow the work"
      # is not true. Gate B stays hand-run — this automates consistency, never use-value.
      - run: node --test scripts/repository-invariants.test.js scripts/decision-index.test.js scripts/runtime-map.test.js
      - run: node scripts/decision-index.mjs > /dev/null
      - run: node scripts/runtime-map.mjs > /dev/null
